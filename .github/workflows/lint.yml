# The Connect IQ SDK requires a Garmin login to download, so CI cannot run
# monkeyc or monkeydo on a GitHub-hosted runner. Everything below is what can
# be checked without the SDK; the Monkey C rings (see AGENTS.md) run on a
# developer machine until a self-hosted runner with the SDK exists, at which
# point add a second job here that runs:
#
#   monkeyc -f monkey.jungle -d fr265 -l 1 --unit-test -y "$KEY" -o bin/t.prg
#   monkeydo bin/t.prg fr265 -t
#
name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fitdecode pillow
      - name: Validate manifest, resources and their references
        run: python tools/validate_resources.py
      - name: Check internal links
        run: python tools/check_links.py

      - name: Byte-compile tools
        run: python -m py_compile tools/*.py
      - name: Python tooling tests
        run: python -m pytest tools/tests -q
